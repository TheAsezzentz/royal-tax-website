<title>Royal Tax Transport HQ · v1.8.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Startpagina: compacte live-status voor personeel en operaties */
.hq-start-live-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 18px}
.hq-live-counts{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0 12px;color:var(--muted,#94a3b8);font-size:13px}
.hq-live-counts span{display:inline-flex;align-items:center;gap:6px}
.hq-live-counts b{color:var(--ink);font-size:17px}
.hq-start-live-grid .hq-presence-dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.hq-start-live-grid .hq-presence-dot.online{background:#36c98f;box-shadow:0 0 0 3px #36c98f20}
.hq-start-live-grid .hq-presence-dot.away{background:#e8b64b;box-shadow:0 0 0 3px #e8b64b20}
.hq-start-live-grid .hq-presence-dot.offline{background:#8792a2}
@media(max-width:760px){.hq-start-live-grid{grid-template-columns:1fr}.hq-live-counts{gap:12px}}

:root{color-scheme:dark;--bg:#0a0907;--card:#100c2b;--card2:#18124a;--ink:#f1eefc;--mut:#9a93bf;--line:#2a2352;--acc:#9b6dff;--acc2:#6d28d9;--on:#fff;--gold:#f2c94c;--bad:#ff7a7a;--ok:#4cd6a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-style:italic;letter-spacing:.01em;margin:0}
header{padding:14px 16px 0;max-width:900px;margin:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
#logo{height:92px;width:auto;mix-blend-mode:screen}
.co{text-align:right;font-weight:600}.co span{display:block;color:var(--gold);font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);font:600 15px Barlow,sans-serif;padding:11px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--ink);border-color:var(--gold)}
main{max-width:900px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-top:2px solid rgba(242,201,76,.4);border-radius:12px;padding:16px;margin-bottom:12px}
.pass{display:grid;grid-template-columns:1fr auto;padding:0;overflow:hidden}

}

splay:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;padding:0 16px 18px}.hq-start-stats>div{border:1px solid #ffffff12;background:#ffffff05;border-radius:10px;padding:12px;min-width:0}.hq-start-stats b{display:block;margin-top:4px;font-size:20px;font-variant-numeric:tabular-nums}.hq-start-bottom-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hq-start-bottom-grid .card{margin:0}.hq-start-bottom-grid .hq-upgrade-intro{align-items:center}

  el.innerHTML='<div style="max-width:430px;width:100%;background:#18124a;border:1px solid #5b3fb0;border-radius:14px;padding:24px;box-sizing:border-box"><h2 style="margin:0 0 8px;font-size:28px">Royal Tax</h2><p id="rt-auth-msg" style="color:#c9c3e7;font-size:14px;line-height:1.5">Log in of maak een account aan.</p><div style="display:flex;gap:8px;margin:16px 0"><button id="rt-auth-mode-login" type="button" style="flex:1;padding:10px;border:1px solid #7c3aed;border-radius:8px;background:#7c3aed;color:white;font-weight:700;cursor:pointer">Inloggen</button><button id="rt-auth-mode-register" type="button" style="flex:1;padding:10px;border:1px solid #5b3fb0;border-radius:8px;background:transparent;color:#cbb8ff;font-weight:700;cursor:pointer">Registreren</button></div><form id="rt-auth-form"><label style="display:block;margin:12px 0 4px">Gebruikersnaam</label><input id="rt-auth-username" type="text" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9._-]{3,24}" required autocapitalize="none" spellcheck="false" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;background:#0a0720;color:white;border:1px solid #5b3fb0"><small id="rt-auth-username-help" style="display:block;color:#b9b1d9;margin-top:5px">3–24 tekens: letters, cijfers, punt, streepje of underscore.</small><label style="display:block;margin:12px 0 4px">Wachtwoord</label><input id="rt-auth-password" type="password" autocomplete="current-password" minlength="8" required style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;background:#0a0720;color:white;border:1px solid #5b3fb0"><button id="rt-auth-submit" type="submit" style="margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#7c3aed;color:white;font-weight:700;cursor:pointer">Inloggen</button></form><p id="rt-auth-register-note" style="display:none;color:#c9c3e7;font-size:12px;line-height:1.5;margin-bottom:0">Na registratie kun je direct inloggen. Iedereen met toegang tot deze link kan een account maken; gebruik een wachtwoord dat je nergens anders gebruikt.</p></div>';

       tx.set(usernameRef,{uid:credential.user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});

const plane=S.fleet.find(x=>x.n===a.ac);if(!planeAllowed(plane,who))return msg('Dit toestel is inmiddels door een andere werknemer geclaimd. Neem contact op met de directie.');const q=quote(a.a,a.b,a.ac,a.type,land,who);if(q.err)return msg(q.err);
window._flightDurationMs=elapsed;window._flightStartedAt=a.startedAt;
try{await addFlight({preventDefault(){}},{who,a:a.a,b:a.b,ac:a.ac,t:a.type,l:land});const completed=(S.log||[]).some(l=>l.who===who&&l.startedAt===a.startedAt);if(!completed)return msg('De vlucht is nog actief: de registratie kon niet worden bevestigd. Probeer opnieuw.');delete S.activeFlights[who];persist();}finally{window._flightDurationMs=null;window._flightStartedAt=null;render();}}

function ledgerAdd(kind,amount,description,who,meta={}){S.ledger=S.ledger||[];const event=meta.idempotencyKey||meta.transactionId||(meta.flightNo?'flight:'+meta.flightNo+':'+kind:null)||(meta.tripId?'trip:'+meta.tripId+':'+kind:null);if(event&&S.ledger.some(x=>x.idempotencyKey===event))return S.ledger.find(x=>x.idempotencyKey===event);const entry={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),ts:Date.now(),kind,amount:Math.round(amount),description:String(description||kind).slice(0,180),who:who||ls('who')||'Systeem',...meta,...(event?{idempotencyKey:event}:{})};S.ledger.unshift(entry);if(S.ledger.length>500){const removed=S.ledger.splice(500);if(S.ledgerOpeningBalance!==undefined)S.ledgerOpeningBalance+=removed.reduce((n,x)=>n+(Number(x.amount)||0),0)}return entry}

function stockMetrics(){
 const shares=100000;
 const cash=Number(S?.bal)||0;
 const msAssets=(S?.fleet||[]).reduce((n,x)=>n+Math.max(0,Number(x.price)||0)*Math.max(0,Math.min(100,Number(x.cond??100)))/100*.8,0);
 const trucks=(S?ets().trucks:[]).reduce((n,x)=>n+Math.max(0,Number(x.price)||0)*Math.max(0,Math.min(100,Number(x.cond??100)))/100*.8,0);
 const valuation=Math.max(100000,Math.round(cash+msAssets+trucks));
 return {shares,cash,msAssets,trucks,valuation,price:valuation/shares};
}
function stockSnapshot(force=false){
 if(!S)return;
 S.stocks=S.stocks||{symbol:'RTA',shares:100000,history:[]};
 S.stocks.symbol='RTA';S.stocks.shares=100000;S.stocks.history=Array.isArray(S.stocks.history)?S.stocks.history:[];
 const m=stockMetrics(),now=Date.now(),h=S.stocks.history,last=h[h.length-1];
 const materiallyChanged=!last||Math.abs(m.valuation-(Number(last.valuation)||0))>=Math.max(500,Math.abs(Number(last.valuation)||0)*.002);
 if(force||!last||materiallyChanged||now-(Number(last.ts)||0)>=6*60*60*1000){
  const point={ts:now,valuation:m.valuation,price:Math.round(m.price*100)/100,cash:m.cash};
  if(last&&now-(Number(last.ts)||0)<60000)h[h.length-1]=point;else h.push(point);
  S.stocks.history=h.slice(-100);
 }
}
function stockExchangeUI(){
 if(!S.stocks?.history?.length){stockSnapshot(true);persist();}
 const m=stockMetrics(),hist=(S.stocks?.history||[]).slice(-24),prev=hist.length>1?hist[hist.length-2]:null,last=hist[hist.length-1];
 const change=prev&&Number(prev.price)>0?(m.price-Number(prev.price))/Number(prev.price)*100:0;
 const first=hist[0]?.price||m.price,periodChange=first>0?(m.price-first)/first*100:0;
 const prices=hist.map(x=>Number(x.price)||m.price);if(!prices.length)prices.push(m.price);
 const min=Math.min(...prices,m.price),max=Math.max(...prices,m.price),range=Math.max(1,max-min);
 const pts=prices.map((v,i)=>`${hist.length<2?400:i*800/(prices.length-1)},${180-(v-min)/range*150}`).join(' ');
 const fmtPct=v=>(v>0?'+':'')+v.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
 const dateLabel=last?new Date(last.ts).toLocaleString('nl-NL'):'Nog geen koershistorie';
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap"><div><div class="mut" style="letter-spacing:.12em;font-size:11px">ROYAL TAX STOCK EXCHANGE</div><h2 style="margin:5px 0">${esc(S.name)} <span class="mut">· ${esc(S.stocks?.symbol||'RTA')}</span></h2><div class="mut">Interne beurs-simulatie · geen echte aandelen of echt geld</div></div><div style="text-align:right"><div class="mut">Indicatieve aandelenkoers</div><div style="font-size:30px;font-weight:800">${E(m.price)}</div><div class="${change>=0?'ok':'bad'}">${fmtPct(change)} sinds vorige koersupdate</div></div></div><div class="grid" style="margin-top:16px"><div class="stat"><span>Geschatte bedrijfswaarde</span><b>${E(m.valuation)}</b></div><div class="stat"><span>Uitstaande aandelen</span><b>${m.shares.toLocaleString('nl-NL')}</b></div><div class="stat"><span>Verandering in getoonde periode</span><b class="${periodChange>=0?'ok':'bad'}">${fmtPct(periodChange)}</b></div><div class="stat"><span>Kas + geschatte voertuigwaarde</span><b>${E(m.cash+m.msAssets+m.trucks)}</b></div></div><div style="margin-top:14px;padding:10px 8px 0;border:1px solid var(--line);border-radius:10px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 8px 8px"><b>Koersverloop</b><span class="mut">${hist.length} meetpunten · bijgewerkt ${esc(dateLabel)}</span></div><svg viewBox="0 0 800 205" role="img" aria-label="Grafiek van de interne aandelenkoers" style="width:100%;height:auto;display:block"><line x1="0" y1="30" x2="800" y2="30" stroke="currentColor" opacity=".12"/><line x1="0" y1="80" x2="800" y2="80" stroke="currentColor" opacity=".12"/><line x1="0" y1="130" x2="800" y2="130" stroke="currentColor" opacity=".12"/><line x1="0" y1="180" x2="800" y2="180" stroke="currentColor" opacity=".12"/><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${prices.length?`<circle cx="${hist.length<2?400:(prices.length-1)*800/(prices.length-1)}" cy="${180-(prices[prices.length-1]-min)/range*150}" r="5" fill="currentColor"/>`:''}</svg><div class="mut" style="padding:0 8px 10px">De koers beweegt wanneer de geschatte bedrijfswaarde verandert. De grafiek begint vanaf het moment dat Stocks wordt ingeschakeld; er wordt geen historische beursdata verzonnen.</div></div><div class="grid" style="margin-top:12px"><div class="stat"><span>MSFS-vlootwaarde (geschat)</span><b>${E(m.msAssets)}</b></div><div class="stat"><span>ETS2-vlootwaarde (geschat)</span><b>${E(m.trucks)}</b></div></div><p class="mut" style="margin-top:10px">Berekening: bedrijfskas plus 80% van de aankoopwaarde van voertuigen, aangepast aan hun conditie. Dit is een speelse indicatie, geen officiële bedrijfswaardering. Aandelen kopen/verkopen en dividend zijn nog niet ingeschakeld.</p></div>`;
}

function flightRadar(compact=false){const flights=Object.entries(S.activeFlights||{}).filter(([,f])=>f&&f.startedAt).sort((a,b)=>b[1].startedAt-a[1].startedAt);return `<div class="card"><h2>Live Flight Radar <span class="pill live">● ${flights.length} actief</span></h2><p class="section-intro">Actieve vluchten verschijnen automatisch zodra een werknemer op Start vlucht drukt. De verstreken tijd loopt live mee.</p>${flights.length?flights.map(([pilot,f])=>`<div class="row"><div><b>${esc(pilot)} · ${esc(f.a)} → ${esc(f.b)}</b><div class="mut">${esc(f.ac)} · ${esc(f.type||'Vlucht')} · gestart ${moneyDate(f.startedAt)}</div></div><div style="text-align:right"><span class="pill live">Onderweg</span><div class="live-clock" data-flight-start="${Number(f.startedAt)}">${durationText(Date.now()-f.startedAt)}</div></div></div>`).join(''):'<p class="mut">Er zijn momenteel geen werknemers in de lucht.</p>'}${compact?'<p class="mut" style="margin-top:12px">Open het tabblad Vlucht voor je eigen timer en vluchtgegevens.</p>':''}</div>`}
function fleetStatus(){const flights=Object.values(S.activeFlights||{});return `<div class="card"><h2>Beschikbaarheid bedrijfsvloot</h2><p class="section-intro">Een claim is exclusief. Alleen de toegewezen werknemer mag met dat vliegtuig vliegen. Tijdens een actieve vlucht is het toestel niet beschikbaar.</p><div class="summaryline"><span class="pill free">${S.fleet.filter(x=>!x.claimedBy).length} vrij te claimen</span><span class="pill">${S.fleet.filter(x=>x.claimedBy).length} geclaimd</span><span class="pill busy">${flights.length} in vlucht</span></div>${S.fleet.map(x=>{const f=flights.find(y=>y.ac===x.n);return `<div class="row"><div><b>${esc(x.n)}</b><div class="mut">${x.claimedBy?'Vaste werknemer: '+esc(x.claimedBy):'Geen vaste werknemer'} · ${Math.round(x.cond)}% conditie</div></div><span class="pill ${f?'busy':x.claimedBy?'':'free'}">${f?'✈ In vlucht':x.claimedBy?'🔒 Geclaimd':'✓ Beschikbaar'}</span></div>`}).join('')||'<div class="empty">Geen vliegtuigen.</div>'}</div>`}
function addNotice(e){e.preventDefault();if(!isOwner())return msg('Alleen de directie kan mededelingen plaatsen.');const title=document.getElementById('notice-title').value.trim(),body=document.getElementById('notice-body').value.trim(),pin=document.getElementById('notice-pin').checked;if(!title||!body)return msg('Vul een titel en bericht in.');S.notices=S.notices||[];S.notices.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),title:title.slice(0,90),body:body.slice(0,1200),pin,by:ls('who'),ts:Date.now()});S.notices=S.notices.slice(0,60);persist();render();msg('Mededeling gepubliceerd.')}

// TRANSPORT HQ: ETS2 afdeling deelt dezelfde bedrijfskas met MSFS 2024.
const ETS_MODELS=['DAF XF','DAF XG','DAF XG+','Scania R','Scania S','Volvo FH','MAN TGX','Mercedes-Benz Actros','Renault T','Iveco S-Way'];
const ETS_TRAILERS=['Geen eigen oplegger','Schuifzeiltrailer','Koeltrailer','Gesloten trailer','Dieplader','Kipper','Tankoplegger','Containerchassis','Houttransport','Autotransporter'];
const ETS_CARGO=['Levensmiddelen','Bouwmaterialen','Machines','Voertuigen','Elektronica','Landbouwproducten','Hout','Brandstof','Chemicaliën','Containers','Overig'];
const ETS_UP={garage:['Garagecapaciteit',90000,4,'Extra ruimte voor vrachtwagens'],dispatch:['Transportplanning',55000,5,'Hogere ritopbrengst: +3% per niveau'],service:['Truckwerkplaats',70000,5,'Lagere reparatiekosten: −8% per niveau'],logistics:['Logistiek netwerk',80000,5,'Hogere ritopbrengst: +2% per niveau']};
const etsDefault=()=>({trucks:[],trips:[],active:{},upgrades:{garage:0,dispatch:0,service:0,logistics:0},nextId:1});
function ets(){if(!S.ets||typeof S.ets!=='object')S.ets=etsDefault();const d=etsDefault();for(const k of Object.keys(d))if(S.ets[k]===undefined)S.ets[k]=d[k];return S.ets}
const branchDefaults=()=>({msfs:{level:0},ets2:{level:0}});
function branches(){S.branches=S.branches||branchDefaults();for(const k of ['msfs','ets2']){S.branches[k]=S.branches[k]||{level:0};S.branches[k].level=Math.max(0,Math.min(3,Number(S.branches[k].level)||0));}return S.branches}
const branchCost=k=>[180000,320000,520000][branches()[k].level]||0;
const branchCapacity=k=>2*branches()[k].level;
const branchDiscount=(k='msfs')=>Math.min(.10,.025*branches()[k].level);
const etsCapacity=()=>3+3*(ets().upgrades.garage||0)+branchCapacity('ets2');
const etsActiveTruck=(id)=>Object.values(ets().active).some(x=>String(x.truckId)===String(id));
const etsClaimed=(who)=>ets().trucks.find(t=>t.claimedBy===who);
const etsFmtTime=(ms)=>durationText(Math.max(0,ms));
const etsOptions=(items)=>items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
function etsClaim(id){const t=ets().trucks.find(x=>x.id===id),who=ls('who');if(!t)return;if(t.claimedBy)return msg('Deze vrachtwagen is al geclaimd.');if(etsClaimed(who))return msg('Je hebt al een vrachtwagen geclaimd.');t.claimedBy=who;persist();render();msg('Vrachtwagen exclusief geclaimd.')}
function etsRelease(id){const t=ets().trucks.find(x=>x.id===id);if(!t)return;if(t.claimedBy!==ls('who')&&!isOwner())return msg('Geen toegang.');if(etsActiveTruck(id))return msg('Vrachtwagen is momenteel onderweg.');delete t.claimedBy;persist();render()}
function etsBuy(e){e.preventDefault();if(!isOwner())return msg('Alleen de directie kan vrachtwagens kopen.');const name=document.getElementById('ets-model')?.value,price=Number(document.getElementById('ets-price')?.value);if(!name||!Number.isFinite(price)||price<=0)return msg('Vul een geldig model en aankoopbedrag in.');if(ets().trucks.length>=etsCapacity())return msg('Garage vol. Upgrade de garage.');if(S.bal<price)return msg('Onvoldoende bedrijfssaldo.');const t={id:'T'+ets().nextId++,name,price,cond:100,km:0,trips:0,revenue:0};ets().trucks.push(t);S.bal-=price;led('inv',price);ledgerAdd('aankoop',-price,'ETS2 vrachtwagen: '+name,ls('who'),{division:'ETS2'});feed('ets',ls('who')+' kocht een '+name+' voor ETS2');persist();render();msg('Vrachtwagen aangeschaft.')}
function etsSell(id){if(!isOwner())return msg('Alleen de directie kan verkopen.');const t=ets().trucks.find(x=>x.id===id);if(!t)return;if(t.claimedBy||etsActiveTruck(id))return msg('Hef eerst de claim op en beëindig de rit.');const amount=Math.round(t.price*.6*(.5+.5*t.cond/100));if(!confirm(t.name+' verkopen voor '+E(amount)+'?'))return;S.bal+=amount;led('inv',-amount);ledgerAdd('verkoop',amount,'ETS2 verkoop: '+t.name,ls('who'),{division:'ETS2'});ets().trucks=ets().trucks.filter(x=>x.id!==id);persist();render()}

><p class="mut">Aankopen worden opgeslagen in de bestaande bedrijfsdata en het kasboek.</p></div></div><div class="hq-visual-foot">Tip: beweeg je muis over de gemarkeerde zones. De aanbouw wordt als preview uitgelicht; klik daarna op de plek of op de koopknop.</div></div>`}
function branchesUI(){

function buyBranch(k){if(!isOwner())return msg('Alleen de directie kan vestigingen uitbreiden.');if(!['msfs','ets2'].includes(k))return;const b=branches(),cost=branchCost(k);if(b[k].level>=3)return msg('Maximaal niveau bereikt.');if(S.bal<cost)return msg('Onvoldoende bedrijfssaldo.');if(!confirm('Vestiging uitbreiden voor '+E(cost)+'?'))return;S.bal-=cost;b[k].level++;ledgerAdd('vestiging',-cost,'Vestiging '+(k==='msfs'?'luchtvaart':'transport')+' niveau '+b[k].level,ls('who'),{division:k==='msfs'?'MSFS':'ETS2'});persist();render();msg('Vestiging uitgebreid.');}
function departmentProfitUI(){const flights=S.log||[],trips=ets().trips||[],msGross=flights.reduce((n,x)=>n+(Number(x.g)||0),0),msNet=flights.reduce((n,x)=>n+(Number(x.e)||0),0),msCost=flights.reduce((n,x)=>n+(Number(x.fc)||0)+(Number(x.rent)||0),0),etGross=trips.reduce((n,x)=>n+(Number(x.gross)||0),0),etNet=trips.reduce((n,x)=>n+(Number(x.net)||0),0),etCost=trips.reduce((n,x)=>n+(Number(x.rent)||0)+(Number(x.operatingCost)||0)+(Number(x.cost)||0)+(Number(x.damageCost)||0),0);return `<div class="card"><h2>Rendement per afdeling</h2><p class="section-intro">Op basis van opgeslagen ritten en vluchten. Historische records zonder volledige kostensplitsing kunnen afwijken.</p><div class="grid"><div class="stat"><span>MSFS · bruto-omzet</span><b>${E(msGross)}</b></div><div class="stat"><span>MSFS · geregistreerde kosten</span><b>${E(msCost)}</b></div><div class="stat"><span>MSFS · netto-resultaat</span><b>${E(msNet)}</b></div><div class="stat"><span>ETS2 · bruto-omzet</span><b>${E(etGross)}</b></div><div class="stat"><span>ETS2 · geregistreerde kosten</span><b>${E(etCost)}</b></div><div class="stat"><span>ETS2 · netto-resultaat</span><b>${E(etNet)}</b></div></div></div>`}
function etsTruckBoard(){const d=ets();return `<div class="card"><h2>Wagenpark · ${d.trucks.length}/${etsCapacity()}</h2><p class="mut">Eén exclusieve vrachtwagenclaim per medewerker. Zonder eigen claim betaal je 45% huur over de totale transportomzet.</p>${d.trucks.map(t=>{const active=etsActiveTruck(t.id),owner=t.claimedBy;return `<div class="row"><div><b>${esc(t.name)}</b> <span class="pill ${active?'live':''}">${active?'Onderweg':owner?'Geclaimd':'Beschikbaar'}</span><div class="mut">${owner?'Toegewezen aan '+esc(owner)+' · ':''}${Math.round(t.cond)}% conditie · ${t.trips} ritten · ${Math.round(t.km).toLocaleString('nl-NL')} km · ${E(t.revenue)} netto</div></div><div style="display:flex;gap:6px;flex-wrap:wrap">${owner?(owner===ls('who')||isOwner()?`<button class="btn alt" onclick="etsRelease('${t.id}')" ${active?'disabled':''}>Claim vrijgeven</button>`:''):`<button class="btn alt" onclick="etsClaim('${t.id}')" ${etsClaimed(ls('who'))?'disabled':''}>Claim vrachtwagen</button>`}<button class="btn alt" onclick="vehicleDossier('ets','${t.id}')">Paspoort</button>${isOwner()?`<button class="btn alt" onclick="etsMaintain('${t.id}')" ${active||t.cond>=100?'disabled':''}>Onderhoud</button><button class="btn alt" onclick="etsSell('${t.id}')" ${owner||active?'disabled':''}>Verkoop</button>`:''}</div></div>`}).join('')||'<div class="empty">Nog geen vrachtwagens. De directie kan hieronder een voertuig aanschaffen.</div>'}</div>${isOwner()?`<div class="card"><h2>Vrachtwagen aanschaffen</h2><form class="f" onsubmit="etsBuy(event)"><div><label>Model</label><select id="ets-model">${etsOptions(ETS_MODELS)}</select></div><div><label>Aankoopprijs (€)</label><input id="ets-price" type="number" min="1" value="100000" required></div><div style="align-self:end"><button class="btn">Aanschaffen</button></div></form></div>`:''}`}
function etsLive(){const a=Object.entries(ets().active);return `<div class="card"><h2>Live transportoverzicht <span class="pill live">● ${a.length} onderweg</span></h2>${a.map(([who,t])=>`<div class="row"><div><b>${esc(who)}</b> · ${esc(t.from)} → ${esc(t.to)}<div class="mut">${esc(t.truckName)} · ${esc(t.cargo)}${t.rental?' · Huurtruck (45%)':''}</div></div><b>${etsFmtTime(Date.now()-t.startedAt)}</b></div>`).join('')||'<p class="mut">Momenteel geen actieve transporten.</p>'}</div>`}
function etsTripUI(){const who=ls('who'),a=ets().active[who];if(a)return `<div class="card"><h2>Actieve ETS2-rit</h2><p class="mut">${esc(a.from)} → ${esc(a.to)} · ${esc(a.truckName)} · ${esc(a.cargo)} · ${esc(a.trailer||'')}</p><div class="big" style="margin:12px 0">${etsFmtTime(Date.now()-a.startedAt)}</div>${a.rental?'<p class="mut">Huurtruck: 45% van de automatisch berekende bruto-omzet wordt afgetrokken.</p>':''}<p class="mut">De ritopbrengst wordt automatisch berekend. Vul alleen de werkelijk gereden kilometers, eventuele schade en overige kosten in.</p><form onsubmit="etsFinish(event)" class="f"><div><label>Gereden kilometers</label><input id="ets-km" type="number" min="1" step="1" required oninput="etsQuoteUI()" onchange="etsQuoteUI()"></div><div><label>Schade (%)</label><input id="ets-damage" type="number" min="0" max="100" value="0" required oninput="etsQuoteUI()" onchange="etsQuoteUI()"></div><div><label>Overige ritkosten (€)</label><input id="ets-cost" type="number" min="0" step="1" value="0" required oninput="etsQuoteUI()" onchange="etsQuoteUI()"></div><div id="ets-calc-preview" style="grid-column:1/-1;padding:12px;border:1px solid var(--line);border-radius:9px"><span class="mut">Vul de gereden kilometers in om de automatische berekening te zien.</span></div><div style="align-self:end"><button class="btn">Rit beëindigen en registreren</button></div></form></div>`;const allowed=ets().trucks.filter(t=>!t.claimedBy||t.claimedBy===who);return `<div class="card"><h2>Nieuwe ETS2-rit</h2><p class="mut">Vul de ritgegevens in en start de timer. Na aflevering berekent Transport HQ automatisch de bruto-omzet en nettowinst op basis van de gereden kilometers en ritgegevens.</p>${!etsClaimed(who)?'<p style="border:1px solid #c9a95a;padding:12px;border-radius:8px">Je hebt geen vrachtwagen geclaimd. Je rijdt met een <b>huurtruck</b>: 45% van de automatisch berekende bruto-omzet wordt ingehouden.</p>':''}<form class="f" onsubmit="etsStart(event)"><div><label>Vertrekstad function etsHistory(){return `<div class="card"><h2>Transportgeschiedenis</h2>${ets().trips.slice(0,50).map(t=>`<div class="row"><div><b>${esc(t.from)} → ${esc(t.to)}</b><div class="mut">${esc(t.who)} · ${esc(t.truckName)} · ${esc(t.cargo)} · ${Math.round(t.km)} km · ${etsFmtTime(t.durationMs)} · ${new Date(t.ts).toLocaleDateString('nl-NL')}</div></div><div style="text-align:right"><b>${E(t.net)}</b><div class="mut">${t.rental?'Huur '+E(t.rent):'Eigen truck'} · schade ${t.damage}%</div></div></div>`).join('')||'<div class="empty">Nog geen afgeronde transporten.</div>'}</div>`}
function msfsUpgradesUI(){

function companyReportText(){
 const now=Date.now(),flights=Array.isArray(S.log)?S.log:[],trips=Array.isArray(ets().trips)?ets().trips:[],weekStart=now-7*86400000,monthStart=now-30*86400000;
 const wf=flights.filter(x=>(Number(x.ts)||0)>=weekStart),mf=flights.filter(x=>(Number(x.ts)||0)>=monthStart),wt=trips.filter(x=>(Number(x.ts)||Number(x.completedAt)||0)>=weekStart),mt=trips.filter(x=>(Number(x.ts)||Number(x.completedAt)||0)>=monthStart);
 const staff=Object.keys(S.p||{}),activity={};staff.forEach(n=>activity[n]={name:n,flights:0,trips:0,xp:0,nm:0});
 flights.forEach(x=>{const n=x.who||'Onbekend';activity[n]=activity[n]||{name:n,flights:0,trips:0,xp:0,nm:0};activity[n].flights++;activity[n].xp+=Number(x.xp)||0;activity[n].nm+=Number(x.d)||0});
 trips.forEach(x=>{const n=x.who||'Onbekend';activity[n]=activity[n]||{name:n,flights:0,trips:0,xp:0,nm:0};activity[n].trips++;activity[n].xp+=Number(x.xp)||0});
 const leaders=Object.values(activity).sort((a,b)=>(b.flights+b.trips)-(a.flights+a.trips)).slice(0,5);
 const fmt=n=>Number(n||0).toLocaleString('nl-NL');
 return `ROYAL TAX — ACTIVITEITSRAPPORT\nGegenereerd: ${new Date(now).toLocaleString('nl-NL')}\n\nBEDRIJF\nBedrijfsnaam: ${S.name||'Royal Tax'}\nBedrijfskas: ${fmt(S.bal)}\nMedewerkers: ${staff.length}\n\nLAATSTE 7 DAGEN\nMSFS-vluchten: ${wf.length}\nETS2-ritten: ${wt.length}\nTotaal activiteiten: ${wf.length+wt.length}\n\nLAATSTE 30 DAGEN\nMSFS-vluchten: ${mf.length}\nETS2-ritten: ${mt.length}\nTotaal activiteiten: ${mf.length+mt.length}\n\nMEEST ACTIEVE MEDEWERKERS (totaal geregistreerde activiteiten)\n${leaders.map((x,i)=>`${i+1}. ${x.name} — ${x.flights} vluchten, ${x.trips} ritten, ${fmt(x.xp)} XP`).join('\n')||'Nog geen activiteiten'}\n\nRoyal Tax — Activiteit = Groei!`;
}

<script>
(function(){
  function removeAccidentalCssText(){
    var root=document.body;
    if(!root)return;
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    var nodes=[];
    while(walker.nextNode()){
      var node=walker.currentNode;
      if(node.nodeValue && node.nodeValue.indexOf('/* Startpagina: compacte live-status voor personeel en operaties */')!==-1) nodes.push(node);
    }
    nodes.forEach(function(node){node.parentNode&&node.parentNode.removeChild(node);});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',removeAccidentalCssText,{once:true});else removeAccidentalCssText();
})();

 function challengeCard(x){
  const goals=[{name:'Airline-activiteit',desc:'Voltooi 3 MSFS-vluchten in 7 dagen',value:x.f7.length,target:3,unit:'vluchten'},{name:'Transportactiviteit',desc:'Rijd 1.000 km in ETS2 in 7 dagen',value:x.km7,target:1000,unit:'km'},{name:'Gecombineerde operatie',desc:'Voltooi 5 activiteiten in beide afdelingen',value:x.f7.length+x.t7.length,target:5,unit:'activiteiten'}];
  return `<div class="rt-v170-card"><h2>🎯 Weekdoelen</h2><p class="rt-v170-muted">Terugkerende doelen zonder contracten of verplichte opdrachten. De voortgang wordt berekend uit geregistreerde activiteiten.</p>${goals.map(g=>{const pct=Math.min(100,Math.round(100*g.value/g.target));return `<div style="margin-top:13px"><div class="rt-v170-row"><div><b>${g.name}</b><div class="rt-v170-muted">${g.desc}</div></div><span class="rt-v170-tag">${g.value>=g.target?'Voltooid':pct+'%'}</span></div><div class="rt-v170-progress"><i style="width:${pct}%"></i></div><div class="rt-v170-muted">${Math.round(g.value).toLocaleString('nl-NL')} / ${g.target.toLocaleString('nl-NL')} ${g.unit}</div></div>`}).join('')}</div>`;
 }
 function milestoneCard(x){
  const n=(Number(S.t&&S.t.n)||0)+x.trips.length,km=x.trips.reduce((v,t)=>v+(Number(t.km)||0),0),nm=Number(S.t&&S.t.nm)||0;
  const ms=[{label:'Eerste 10 vluchten',value:Number(S.t&&S.t.n)||0,target:10},{label:'50 gecombineerde activiteiten',value:n,target:50},{label:'10.000 nm gevlogen',value:nm,target:10000},{label:'10.000 km vervoerd',value:km,target:10000}];
  return `<div class="rt-v170-card"><h2>🏅 Bedrijfsmijlpalen</h2><p class="rt-v170-muted">Een overzicht van langetermijnprestaties. Voortgang is indicatief op basis van de gegevens die momenteel bewaard zijn.</p>${ms.map(m=>{let p=Math.min(100,Math.round(m.value/m.target*100));return `<div class="rt-v170-row"><div style="flex:1;min-width:0"><b>${m.label}</b><div class="rt-v170-progress"><i style="width:${p}%"></i></div><div class="rt-v170-muted">${Math.round(m.value).toLocaleString('nl-NL')} / ${m.target.toLocaleString('nl-NL')}</div></div><span class="rt-v170-tag">${p>=100?'Behaald':p+'%'}</span></div>`}).join('')}</div>`;
 }
 function financeCard(x){
  const rows=x.ledger.filter(l=>(Number(l.ts)||0)>=x.month),bucket={MSFS:{income:0,cost:0,count:0},ETS2:{income:0,cost:0,count:0},Overig:{income:0,cost:0,count:0}};
  rows.forEach(l=>{let d=String(l.division||'').toUpperCase(),desc=String(l.description||l.kind||'').toUpperCase(),k=(d.includes('MSFS')||desc.includes('MSFS')||desc.includes('VLUCHT'))?'MSFS':(d.includes('ETS')||desc.includes('ETS2')||desc.includes('TRANSPORT')||desc.includes('RIT'))?'ETS2':'Overig',v=Number(l.amount)||0;bucket[k][v>=0?'income':'cost']+=Math.abs(v);bucket[k].count++});
  return `<div class="rt-v170-card full"><h2>📊 Financiële momentopname · laatste 30 dagen</h2><p class="rt-v170-muted">Kasboekmutaties per afdeling op basis van het label dat bij de boeking is opgeslagen. Niet-gelabelde posten vallen onder Overig.</p><div class="rt-v170-stats"><div class="rt-v170-stat"><span>Netto kasmutatie · 7 dagen</span><b>${money(x.cash7)}</b></div><div class="rt-v170-stat"><span>Netto kasmutatie · 30 dagen</span><b>${money(x.cash30)}</b></div><div class="rt-v170-stat"><span>Vluchtactiviteit · 30 dagen</span><b>${x.f30.length}</b></div><div class="rt-v170-stat"><span>Transportactiviteit · 30 dagen</span><b>${x.t30.length}</b></div></div><div style="overflow-x:auto;margin-top:12px"><table class="rt-v170-table"><thead><tr><th>Afdeling</th><th>Inkomsten</th><th>Uitgaven</th><th>Netto</th><th>Boekingen</th></tr></thead><tbody>${Object.entries(bucket).map(([k,v])=>`<tr><td>${k}</td><td>${money(v.income)}</td><td>${money(v.cost)}</td><td>${money(v.income-v.cost)}</td><td>${v.count}</td></tr>`).join('')}</tbody></table></div><div class="rt-v170-alert ${Math.abs(x.delta)>1?'danger':''}">${Math.abs(x.delta)<=1?'✓':'⚠'} ${Math.abs(x.delta)<=1?'Het huidige saldo sluit aan op de geboekte mutaties.':'Er is een saldo-verschil van '+money(Math.abs(x.delta))+'. Controleer handmatige saldo-aanpassingen en ontbrekende boekingen.'} Deze controle vergelijkt de bedrijfskas met het kasboek; zij bewijst niet dat iedere boeking inhoudelijk correct is.</div></div>`;
 }
 function backupCard(){return `<div class="rt-v170-card"><h2>🛟 Back-up & herstel</h2><p class="rt-v170-muted">Download een volledige JSON-kopie van de huidige bedrijfsstatus voordat je grote wijzigingen doet. Alleen de directie kan een back-up terugzetten.</p><div class="rt-v170-actions"><button class="btn alt" type="button" onclick="rtV170Export()">Download bedrijfsback-up</button>${typeof isOwner==='function'&&isOwner()?`<label class="btn alt" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer">Back-up terugzetten <input type="file" accept="application/json,.json" style="max-width:160px" onchange="rtV170Restore(this)"></label>`:''}</div><div class="rt-v170-alert">Een back-up bevat bedrijfs- en personeelsgegevens. Bewaar het bestand privé. Terugzetten vervangt de gedeelde status en moet daarom zorgvuldig gebeuren.</div></div>`}
 function securityCard(){const owner=typeof isOwner==='function'&&isOwner();return `<div class="rt-v170-card"><h2>🔐 Beveiligingsstatus</h2><div class="rt-v170-row"><span>Ingelogde medewerker</span><b>${escV(typeof ls==='function'?ls('who')||'Onbekend':'Onbekend')}</b></div><div class="rt-v170-row"><span>Directierechten in app</span><span class="rt-v170-tag">${owner?'Directie':'Medewerker'}</span></div><div class="rt-v170-alert danger"><b>Belangrijk:</b> de rolcontroles in HTML zijn geen volledige beveiligingsgrens. Firebase Firestore-regels moeten directe schrijfacties op <code>co/main</code>, rollen en saldo beschermen. Gebruik geen openbare schrijfrechten voor de gedeelde bedrijfsdatabase.</div><p class="rt-v170-muted" style="margin-top:8px">Deze versie kan de status van de client niet gebruiken om te bewijzen dat Firestore-regels veilig zijn. Controleer de regels in Firebase Console en test met een gewoon medewerkersaccount.</p></div>`}
 function activityCard(x){const f=x.flights[0],t=x.trips[0],recent=[...(f?[{kind:'MSFS',name:(f.a||'?')+' → '+(f.b||'?'),who:f.who,ts:f.ts,amount:f.e}]:[]),...(t?[{kind:'ETS2',name:(t.from||'?')+' → '+(t.to||'?'),who:t.who,ts:t.ts,amount:t.net}]:[])];return `<div class="rt-v170-card"><h2>🕒 Recente operatie</h2>${recent.length?recent.map(a=>`<div class="rt-v170-row"><div><b>${a.kind} · ${escV(a.name)}</b><div class="rt-v170-muted">${escV(a.who||'Onbekend')} · ${a.ts?new Date(a.ts).toLocaleString('nl-NL'):'tijd onbekend'}</div></div><b>${money(a.amount)}</b></div>`).join(''):'<p class="rt-v170-muted">Nog geen afgeronde activiteit geregistreerd.</p>'}<div class="rt-v170-actions"><button class="btn alt" onclick="setTab('reports')">Rapporten openen</button><button class="btn alt" onclick="setTab('fin')">Financiën openen</button></div></div>`}
 function mount(){
  if(typeof S==='undefined'||!S||!document.getElementById('v'))return;
  const root=document.getElementById('v');if(tab==='hub'&&!root.querySelector('#rt-v170-wrap')){
   const x=snapshot();if(!x)return;
   const html=`<section id="rt-v170-wrap" class="rt-v170-wrap"><div class="rt-v170-card full"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><span class="rt-v170-tag">VERSIE 1.7.0 · GEEN CONTRACTEN</span><h2 style="margin-top:8px">Royal Tax · Bedrijfscontrole & groei</h2><p class="rt-v170-muted">Eén onderneming, twee afdelingen, gedeelde kas. Weekdoelen en mijlpalen geven richting zonder contracten of verplichte opdrachten.</p></div><div class="rt-v170-actions"><button class="btn alt" onclick="rtV170Export()">⬇ Back-up maken</button><button class="btn alt" onclick="setTab('fin')">Financieel controlecentrum</button></div></div><div class="rt-v170-stats"><div class="rt-v170-stat"><span>Bedrijfskas</span><b>${money(S.bal)}</b></div><div class="rt-v170-stat"><span>Bedrijfslevel</span><b>${typeof pr==='function'?pr(Number(S.xp)||0,req).L:'—'}</b></div><div class="rt-v170-stat"><span>Medewerkers</span><b>${x.people.length}</b></div><div class="rt-v170-stat"><span>Activiteiten deze 7 dagen</span><b>${x.f7.length+x.t7.length}</b></div></div></div>${challengeCard(x)}${milestoneCard(x)}${activityCard(x)}${backupCard()}${securityCard()}</section>`;
   const sync=root.querySelector('#hq-syncbar');if(sync)sync.insertAdjacentHTML('afterend',html);else root.insertAdjacentHTML('afterbegin',html);
  }
  if(tab==='fin'&&!root.querySelector('#rt-v170-finance')){const x=snapshot(),node=document.createElement('div');node.id='rt-v170-finance';node.innerHTML=financeCard(x);root.appendChild(node)}
 }
 const originalRender=window.render;
 if(typeof originalRender==='function')window.render=function(){originalRender.apply(this,arguments);try{mount()}catch(e){console.warn('Royal Tax v1.8.0 enhancement:',e)}};
 // Existing UI may have rendered before this extension loaded; mount again after parsing.
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,0));else setTimeout(mount,0);
})();
</script>
</body>
</html>
