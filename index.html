.rt-kpi,.stat{position:relative;overflow:hidden}
.rt-kpi::after,.stat::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;pointer-events:none;background:linear-gradient(90deg,transparent,#ffffff10,transparent);animation:rtSweep 7s ease-in-out infinite}
.rt-kpi:nth-child(2)::after,.stat:nth-child(2)::after{animation-delay:.8s}
.rt-kpi:nth-child(3)::after,.stat:nth-child(3)::after{animation-delay:1.6s}
.rt-kpi:nth-child(4)::after,.stat:nth-child(4)::after{animation-delay:2.4s}
}

body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:screen;background:radial-gradient(38% 34% at 22% 30%,#2563eb40,transparent 70%),radial-gradient(34% 30% at 78% 68%,#ff8a1f2e,transparent 70%),radial-gradient(28% 26% at 60% 15%,#7c3aed26,transparent 70%);animation:rtOrbA 26s ease-in-out infinite alternate;will-change:transform}
}

<script>
/* LITE: gebundelde render (max 1x per 600ms, niet in achtergrondtab) */
(function(){var t=null,pending=false,last=0;
function doRender(){t=null;pending=false;last=Date.now();
 if(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
 window.__rtSnap=1;document.body.classList.add("rt-still");
 try{render()}finally{window.__rtSnap=0;requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.remove("rt-still")})})}}
window.rtQueueRender=function(){if(document.hidden){pending=true;return}
 if(t)return;var wait=Math.max(50,600-(Date.now()-last));t=setTimeout(doRender,wait)};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&pending)rtQueueRender()});
})();
</script>

(function rtNavEvents(){
  const fine=()=>window.matchMedia&&matchMedia('(hover:hover) and (min-width:1281px)').matches;
  let hoverT=null;
  document.addEventListener('click',e=>{
    const t=e.target.closest&&e.target.closest('[data-rt-toggle]');
    if(t){const id=t.dataset.rtToggle;RT_NAV.open=RT_NAV.open===id?null:id;rtSyncOpen();return}
    const bg=e.target.closest&&e.target.closest('#rt-burger');
    if(bg){const o=!document.body.classList.contains('rt-menu-open');document.body.classList.toggle('rt-menu-open',o);bg.setAttribute('aria-expanded',String(o));return}
    if(!(e.target.closest&&e.target.closest('.rt-mi.has-sub,.rt-usr'))&&RT_NAV.open){rtCloseMenus()}
  });
  document.addEventListener('mouseover',e=>{
    if(!fine())return;const li=e.target.closest&&e.target.closest('.rt-mi.has-sub,.rt-usr');if(!li)return;
    clearTimeout(hoverT);hoverT=setTimeout(()=>{if(RT_NAV.open!==li.dataset.sub){RT_NAV.open=li.dataset.sub;rtSyncOpen()}},70);
  });
  document.addEventListener('mouseout',e=>{
    if(!fine())return;const li=e.target.closest&&e.target.closest('.rt-mi.has-sub,.rt-usr');if(!li)return;
    if(e.relatedTarget&&li.contains(e.relatedTarget))return;
    clearTimeout(hoverT);hoverT=setTimeout(()=>{if(RT_NAV.open===li.dataset.sub&&!li.contains(document.activeElement)){rtCloseMenus()}},260);
  });
  document.addEventListener('focusout',e=>{
    const li=e.target.closest&&e.target.closest('.rt-mi.has-sub,.rt-usr');
    if(li&&RT_NAV.open===li.dataset.sub&&e.relatedTarget&&!li.contains(e.relatedTarget))rtCloseMenus();
  });
  document.addEventListener('keydown',e=>{
    const li=e.target.closest&&e.target.closest('.rt-mi.has-sub,.rt-usr');
    if(e.key==='Escape'){
      if(RT_NAV.open){const id=RT_NAV.open,tg=document.querySelector(`[data-rt-toggle="${id}"]`);rtCloseMenus();if(li&&tg)tg.focus()}
      else if(document.body.classList.contains('rt-menu-open')){document.body.classList.remove('rt-menu-open');const b=document.getElementById('rt-burger');if(b){b.setAttribute('aria-expanded','false');b.focus()}}
      return;
    }
    if(!li)return;
    const items=[...li.querySelectorAll('.rt-sub button')];
    if(e.target.matches('[data-rt-toggle]')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
      e.preventDefault();RT_NAV.open=li.dataset.sub;rtSyncOpen();(e.key==='ArrowDown'?items[0]:items[items.length-1])?.focus();return;
    }
    if(e.target.closest('.rt-sub')){
      const i=items.indexOf(document.activeElement);
      if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}
      else if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus()}
      else if(e.key==='Home'){e.preventDefault();items[0].focus()}
      else if(e.key==='End'){e.preventDefault();items[items.length-1].focus()}
    }
  });
  addEventListener('resize',()=>{if(innerWidth>1280){document.body.classList.remove('rt-menu-open')}});
})();

function rtNameHTML(n){

function rtTrend(cur,prev){
  if(!(prev>0))return null;const p=Math.round((cur-prev)/prev*100);return {p,up:p>=0};
}
function rtDashData(){
  const now=Date.now(),W=7*864e5;
  const flights=Array.isArray(S.log)?S.log:[],trips=Array.isArray(ets().trips)?ets().trips:[];
  const fRev=x=>Number(x.g!=null?x.g:x.e)||0,tRev=x=>Number(x.gross||x.rev||x.net)||0;
  const totalRev=(Number(S.t&&S.t.e)||0)+trips.reduce((n,t)=>n+tRev(t),0);
  const inWin=(x,a,b)=>{const t=Number(x.ts)||0;return t>now-b&&t<=now-a};
  const sumWin=(a,b)=>flights.filter(x=>inWin(x,a,b)).reduce((n,x)=>n+fRev(x),0)+trips.filter(x=>inWin(x,a,b)).reduce((n,x)=>n+tRev(x),0);
  const oldest=Math.min(...[...flights,...trips].map(x=>Number(x.ts)||now),now);
  const trustable=!(flights.length>=60&&oldest>now-2*W); // het vluchtlog bewaart max. 60 items
  const trend=trustable?rtTrend(sumWin(0,W),sumWin(W,2*W)):null;
  const days=[...Array(7)].map((_,i)=>{const end=now-(6-i)*864e5,start=end-864e5;return [...flights,...trips].filter(x=>{const t=Number(x.ts)||0;return t>start&&t<=end}).length});
  const led=Array.isArray(S.ledger)?S.ledger:[];let spark=null;
  if(led.length>=2){let b=Number(S.bal)||0;const pts=[b];for(const x of led.slice(0,30)){b-=Number(x.amount)||0;pts.unshift(b)}spark=pts}
  const staff=Object.entries(S.p||{}).map(([name,p])=>({name,role:p.role||'Werknemer',st:presenceState(name)}));
  const aF=Object.entries(S.activeFlights||{}).filter(([,f])=>f&&f.startedAt).map(([who,f])=>({who,kind:'air',f}));
  const aT=Object.entries((ets().active)||{}).filter(([,t])=>t&&t.startedAt).map(([who,t])=>({who,kind:'road',t}));
  const vehicles=(S.fleet||[]).length+((ets().trucks)||[]).length;
  const allOps=[...flights,...trips],cnt=(a,b)=>allOps.filter(x=>inWin(x,a,b)).length;
  const opsTrend=trustable?rtTrend(cnt(0,W),cnt(W,2*W)):null;
  const kasWeek=led.length?led.filter(x=>Number(x.ts)>now-W).reduce((n,x)=>n+(Number(x.amount)||0),0):null;
  return {flights,trips,totalRev,trend,days,spark,staff,aF,aT,vehicles,opsCount:flights.length+trips.length,opsTrend,kasWeek};
}

}

const RTMAP={el:null,map:null,layer:null,loading:false,key:'',tried:{}};
function rtGC(a,b,n){
  const A=AP[a],B=AP[b];if(!A||!B)return null;const r=Math.PI/180,p1=A[0]*r,l1=A[1]*r,p2=B[0]*r,l2=B[1]*r;
  const dd=2*Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2));if(!dd)return null;
  const o=[];let prevLon=null,off=0;
  for(let i=0;i<=n;i++){const f=i/n,s1=Math.sin((1-f)*dd)/Math.sin(dd),s2=Math.sin(f*dd)/Math.sin(dd),
    x=s1*Math.cos(p1)*Math.cos(l1)+s2*Math.cos(p2)*Math.cos(l2),y=s1*Math.cos(p1)*Math.sin(l1)+s2*Math.cos(p2)*Math.sin(l2),z=s1*Math.sin(p1)+s2*Math.sin(p2);
    let lat=Math.atan2(z,Math.hypot(x,y))/r,lon=Math.atan2(y,x)/r+off;
    if(prevLon!==null){if(lon-prevLon>180){off-=360;lon-=360}else if(lon-prevLon<-180){off+=360;lon+=360}}
    prevLon=lon;o.push([lat,lon])}
  return o;
}
const rtBearing=(p,q)=>{const r=Math.PI/180,y=Math.sin((q[1]-p[1])*r)*Math.cos(q[0]*r),x=Math.cos(p[0]*r)*Math.sin(q[0]*r)-Math.sin(p[0]*r)*Math.cos(q[0]*r)*Math.cos((q[1]-p[1])*r);return (Math.atan2(y,x)/r+360)%360};

function rtRouteCache(){return window.__etsRouteCache||(window.__etsRouteCache=(()=>{try{return JSON.parse(ls('etsRouteCache')||'{}')}catch(e){return {}}})())}
async function rtTruckRoute(from,to){
  const cache=rtRouteCache(),key=from.toLowerCase()+'>'+to.toLowerCase();
  if(cache['route:'+key])return cache['route:'+key];
  if(RTMAP.tried[key])return null;RTMAP.tried[key]=1;
  const geo=async p=>{const k='geo:'+p.toLowerCase();if(cache[k])return cache[k];const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(p));if(!r.ok)throw Error('geocode');const a=await r.json();if(!a.length)throw Error('not found');const v={lat:+a[0].lat,lon:+a[0].lon,label:a[0].display_name};cache[k]=v;return v};
  try{
    const a=await geo(from);await new Promise(r=>setTimeout(r,1100));const b=await geo(to);
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson&steps=false`);
    if(!r.ok)throw Error('routing');const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error('no road');

  }catch(e){return null}
}
function rtMapDraw(fit){

function stockMetrics(){
 const shares=100000;
 const cash=Number(S?.bal)||0;
 const msAssets=(S?.fleet||[]).reduce((n,x)=>n+Math.max(0,Number(x.price)||0)*Math.max(0,Math.min(100,Number(x.cond??100)))/100*.8,0);
 const trucks=(S?ets().trucks:[]).reduce((n,x)=>n+Math.max(0,Number(x.price)||0)*Math.max(0,Math.min(100,Number(x.cond??100)))/100*.8,0);
 const valuation=Math.max(100000,Math.round(cash+msAssets+trucks));
 return {shares,cash,msAssets,trucks,valuation,price:valuation/shares};
}
function stockSnapshot(force=false){
 if(!S)return;
 S.stocks=S.stocks||{symbol:'RTA',shares:100000,history:[]};
 S.stocks.symbol='RTA';S.stocks.shares=100000;S.stocks.history=Array.isArray(S.stocks.history)?S.stocks.history:[];
 const m=stockMetrics(),now=Date.now(),h=S.stocks.history,last=h[h.length-1];
 const materiallyChanged=!last||Math.abs(m.valuation-(Number(last.valuation)||0))>=Math.max(500,Math.abs(Number(last.valuation)||0)*.002);
 if(force||!last||materiallyChanged||now-(Number(last.ts)||0)>=6*60*60*1000){
  const point={ts:now,valuation:m.valuation,price:Math.round(m.price*100)/100,cash:m.cash};
  if(last&&now-(Number(last.ts)||0)<60000)h[h.length-1]=point;else h.push(point);
  S.stocks.history=h.slice(-100);
 }
}

function buyBranch(k){if(!isOwner())return msg('Alleen de directie kan vestigingen uitbreiden.');if(!['msfs','ets2'].includes(k))return;const b=branches(),cost=branchCost(k);if(b[k].level>=3)return msg('Maximaal niveau bereikt.');if(availableFunds()<cost)return msg('Onvoldoende vrij besteedbaar saldo; controleer de reserves.');if(!confirm('Vestiging uitbreiden voor '+E(cost)+'?'))return;S.bal-=cost;b[k].level++;ledgerAdd('vestiging',-cost,'Vestiging '+(k==='msfs'?'luchtvaart':'transport')+' niveau '+b[k].level,ls('who'),{division:k==='msfs'?'MSFS':'ETS2'});persist();render();msg('Vestiging uitgebreid.');}

function etsTruckBoard(){const d=ets();return `<div class="card"><h2>Wagenpark · ${d.trucks.length}/${etsCapacity()}</h2><p class="mut">Eén exclusieve vrachtwagenclaim per medewerker. Zonder eigen claim betaal je 48% huur over de totale transportomzet. De basisopbrengst is € 22 per km vóór vracht-, oplegger- en conditiefactoren.</p>${d.trucks.map(t=>{const active=etsActiveTruck(t.id),owner=t.claimedBy;return `<div class="row"><div><b>${esc(t.name)}</b> <span class="pill ${active?'live':''}">${active?'Onderweg':owner?'Geclaimd':'Beschikbaar'}</span><div class="mut">${owner?'Toegewezen aan '+esc(owner)+' · ':''}${Math.round(t.cond)}% conditie · ${t.trips} ritten · ${Math.round(t.km).toLocaleString('nl-NL')} km · ${E(t.revenue)} netto</div></div><div style="display:flex;gap:6px;flex-wrap:wrap">${owner?(owner===ls('who')||isOwner()?`<button class="btn alt" onclick="etsRelease('${t.id}')" ${active?'disabled':''}>Claim vrijgeven</button>`:''):`<button class="btn alt" onclick="etsClaim('${t.id}')" ${etsClaimed(ls('who'))?'disabled':''}>Claim vrachtwagen</button>`}<button class="btn alt" onclick="vehicleDossier('ets','${t.id}')">Paspoort</button>${isOwner()?`<button class="btn alt" onclick="etsMaintain('${t.id}')" ${active||t.cond>=100?'disabled':''}>Onderhoud</button><button class="btn alt" onclick="etsSell('${t.id}')" ${owner||active?'disabled':''}>Verkoop</button>`:''}</div></div>`}).join('')||'<div class="empty">Nog geen vrachtwagens. De directie kan hieronder een voertuig aanschaffen.</div>'}</div>${isOwner()?`<div class="card"><h2>Vrachtwagen aanschaffen</h2><form class="f" onsubmit="etsBuy(event)"><div><label>Model</label><select id="ets-model" onchange="document.getElementById('ets-price').value=etsPriceOf(this.value)">${etsOptions(ETS_MODELS)}</select></div><div><label>Vaste prijs (catalogus)</label><input id="ets-price" type="number" value="${etsPriceOf(ETS_MODELS[0])}" readonly></div><div style="align-self:end"><button class="btn">Aanschaffen</button></div></form t op basis van de gereden kilometers en ritgegevens.</p>${!own?'<p style="border:1px solid #c9a95a;padding:12px;border-radius:8px">Je hebt geen vrachtwagen geclaimd. Kies <b>Huurtruck</b> om direct te kunnen rijden; 48% van de automatisch berekende bruto-omzet wordt ingehouden.</p>':''}<form class="f" onsubmit="etsStart(event)"><div><label>Vertrekstad</label><input id="ets-from" required placeholder="Rotterdam"></div><div><label>Bestemming</label><input id="ets-to" required placeholder="Hamburg"></div><div><label>Vrachtwagen</label><select id="ets-truck" required>${!own?'<option value="RENTAL">Huurtruck · 48% inhouding</option>':''}${allowed.map(t=>`<option value="${t.id}">${esc(t.name)}${t.claimedBy?' · Mijn vrachtwagen':''}</option>`).join('')}</select></div><div><label>Goederen</label><select id="ets-cargo">${etsOptions(ETS_CARGO)}</select></div><div><label>Oplegger</label><select id="ets-trailer">${etsOptions(ETS_TRAILERS)}</select></div><div><label>Gewicht (ton)</label><input id="ets-weight" type="number" min="0" step="0.1" value="0"></div><div style="align-self:end"><button class="btn">Start rit</button></div></form></div>`}

function ensureLedgerOpeningBalance(){if(!S||!Array.isArray(S.ledger)||S.ledgerOpeningBalance!==undefined)return;S.ledgerOpeningBalance=Number(S.bal||0)-S.ledger.reduce((n,x)=>n+(Number(x.amount)||0),0);}
function strategyInit(){
 if(!S)return;
 S.strategy=S.strategy||{};
 S.strategy.reserves=S.strategy.reserves||{maintenance:0,strategic:0};
 S.strategy.reserves.maintenance=Math.max(0,Number(S.strategy.reserves.maintenance)||0);
 S.strategy.reserves.strategic=Math.max(0,Number(S.strategy.reserves.strategic)||0);
 S.strategy.projects=Array.isArray(S.strategy.projects)?S.strategy.projects:[];
 S.strategy.history=Array.isArray(S.strategy.history)?S.strategy.history:[];
 S.strategy.stage=Number(S.strategy.stage)||1;
 S.strategy.lastReview=S.strategy.lastReview||0;
}
function reserveTotal(){strategyInit();return Number(S.strategy.reserves.maintenance||0)+Number(S.strategy.reserves.strategic||0)+S.strategy.projects.reduce((n,p)=>n+Math.max(0,Number(p.saved)||0),0)}
function availableFunds(){return Math.max(0,Number(S?.bal||0)-reserveTotal())}
function strategyRecord(action,amount,detail){strategyInit();S.strategy.history.unshift({ts:Date.now(),who:ls('who')||'Systeem',action,amount:Math.round(Number(amount)||0),detail:String(detail||'').slice(0,180)});S.strategy.history=S.strategy.history.slice(0,200);feed('strategy',(ls('who')||'Systeem')+' · '+action+': '+detail);}
function moveReserve(e){e.preventDefault();if(!isOwner())return msg('Alleen de directie kan reserves beheren.');strategyInit();const bucket=document.getElementById('reserve-bucket').value,action=document.getElementById('reserve-action').value,amount=Math.round(Number(document.getElementById('reserve-amount').value)||0);if(amount<=0)return msg('Vul een bedrag groter dan nul in.');const key=bucket==='maintenance'?'maintenance':'strategic';if(action==='allocate'){if(availableFunds()<amount)return msg('Onvoldoende vrij besteedbaar saldo. De bestaande reserves blijven beschermd.');S.strategy.reserves[key]+=amount;strategyRecord('Reserve toegewezen',amount,(key==='maintenance'?'Onderhoudsreserve':'Strategische reserve'));}else{if(S.strategy.reserves[key]<amount)return msg('Dit bedrag staat niet in deze reserve.');S.strategy.reserves[key]-=amount;strategyRecord('Reserve vrijgegeven',amount,(key==='maintenance'?'Onderhoudsreserve':'Strategische reserve'));}ledgerAdd('reserve',0,(action==='allocate'?'Reservering':'Vrijgave reserve')+' · '+(key==='maintenance'?'Onderhoud':'Strategisch'),ls('who'),{division:'HQ',reserveBucket:key,reserveAction:action,reserveAmount:amount});persist();render();msg('Reserves bijgewerkt.');}
function addProject(e){e.preventDefault();if(!isOwner())return msg('Alleen de directie kan investeringsdoelen toevoegen.');strategyInit();const name=document.getElementById('project-name').value.trim(),target=Math.round(Number(document.getElementById('project-target').value)||0),desc=document.getElementById('project-desc').value.trim();if(name.length<3||target<=0)return msg('Vul een projectnaam en een doelbedrag in.');S.strategy.projects.push({id:'P'+Date.now().toString(36),name:name.slice(0,70),target,saved:0,desc:desc.slice(0,180),createdAt:Date.now(),createdBy:ls('who')});strategyRecord('Investeringsdoel aangemaakt',target,name);persist();render();msg('Investeringsdoel toegevoegd.');}
function fundProject(id){if(!isOwner())return msg('Alleen de directie kan investeringsdoelen financieren.');strategyInit();const p=S.strategy.projects.find(x=>x.id===id);if(!p)return;const raw=prompt('Hoeveel wil je vanuit vrij besteedbaar saldo reserveren voor '+p.name+'?\nDoel: '+E(p.target)+' · reeds gereserveerd: '+E(p.saved||0));if(raw===null)return;const amount=Math.round(Number(raw)||0);if(amount<=0)return msg('Vul een bedrag groter dan nul in.');if(availableFunds()<amount)return msg('Onvoldoende vrij besteedbaar saldo.');p.saved=(Number(p.saved)||0)+amount;strategyRecord('Project gereserveerd',amount,p.name);persist();render();msg('Bedrag gereserveerd voor '+p.name+'.');}
function releaseProject(id){if(!isOwner())return msg('Alleen de directie kan projectreserves vrijgeven.');strategyInit();const p=S.strategy.projects.find(x=>x.id===id);if(!p)return;const amount=Math.round(Number(p.saved)||0);if(!amount)return msg('Voor dit project staat geen geld gereserveerd.');if(!confirm('Geef '+E(amount)+' van project '+p.name+' vrij?'))return;p.saved=0;strategyRecord('Projectreserve vrijgegeven',amount,p.name);persist();render();msg('Projectreserve vrijgegeven.');}
function removeProject(id){if(!isOwner())return msg('Alleen de directie kan investeringsdoelen verwijderen.');strategyInit();const p=S.strategy.projects.find(x=>x.id===id);if(!p)return;if((Number(p.saved)||0)>0)return msg('Geef eerst de projectreserve vrij.');if(!confirm('Investeringsdoel '+p.name+' verwijderen?'))return;S.strategy.projects=S.strategy.projects.filter(x=>x.id!==id);strategyRecord('Investeringsdoel verwijderd',0,p.name);persist();render();}
function setCompanyStage(value){if(!isOwner())return msg('Alleen de directie kan de bedrijfsfase aanpassen.');const n=Math.max(1,Math.min(5,Number(value)||1));strategyInit();S.strategy.stage=n;strategyRecord('Bedrijfsfase bijgewerkt',n,'Niveau '+n+' · '+['Startende onderneming','Regionale speler','Professionele operator','Internationale onderneming','Grote transportgroep'][n-1]);persist();render();msg('Bedrijfsfase bijgewerkt.');}
function setEmployeeRole(name,value){if(!isOwner())return msg('Alleen de directie kan functies aanpassen.');const p=S.p?.[name];if(!p)return;if(name===ls('who')&&p.role==='Oprichter'&&value!=='Oprichter')return msg('De oprichter kan zijn eigen rol niet wijzigen.');if(!['Oprichter','Mede-eigenaar','Operations Manager','Finance Manager','Senior Pilot / Senior Driver','Pilot / Driver','Trainee','Werknemer'].includes(value))return;const previous=p.role||'Werknemer';p.role=value;strategyRecord('Functie gewijzigd',0,name+': '+previous+' → '+value);persist();render();msg('Functie bijgewerkt.');}
function strategyMetrics(){strategyInit();const ledger=Array.isArray(S.ledger)?S.ledger:[],now=Date.now(),since30=now-30*86400000,since90=now-90*86400000;const within=ledger.filter(x=>(Number(x.ts)||0)>=since30),within90=ledger.filter(x=>(Number(x.ts)||0)>=since90);const sum=(arr,pred)=>arr.filter(pred).reduce((n,x)=>n+(Number(x.amount)||0),0);const revenue=sum(within,x=>Number(x.amount)>0&&['rev','transport','omzet'].includes(String(x.kind||'').toLowerCase()));const expense=-sum(within,x=>Number(x.amount)<0&&['fuel','rent','mnt','oth','onderhoud','uitgave','huur','schade'].includes(String(x.kind||'').toLowerCase()));const investment=-sum(within,x=>Number(x.amount)<0&&['inv','aankoop','vestiging'].includes(String(x.kind||'').toLowerCase()));const net=sum(within,x=>Number(x.amount)!==0);const net90=sum(within90,x=>Number(x.amount)!==0);const monthKey=new Date().toISOString().slice(0,7);const month=ledger.filter(x=>new Date(Number(x.ts)||0).toISOString().slice(0,7)===monthKey);const monthNet=sum(month,x=>Number(x.amount)!==0);const assets=(S.fleet||[]).reduce((n,x)=>n+Number(x.price||0)*(.5+.5*(Number(x.cond)||0)/100),0)+(ets().trucks||[]).reduce((n,x)=>n+Number(x.price||0)*(.5+.5*(Number(x.cond)||0)/100),0);const operating90=-sum(within90,x=>Number(x.amount)<0&&['fuel','rent','mnt','oth','onderhoud','uitgave','huur','schade'].includes(String(x.kind||'').toLowerCase()));const target=Math.round(Math.max(0,operating90/3));return{ledger,within,within90,revenue,expense,investment,net,net90,month,monthNet,assets,target,maintenanceReserve:Number(S.strategy.reserves.maintenance)||0,strategicReserve:Number(S.strategy.reserves.strategic)||0,projectReserve:S.strategy.projects.reduce((n,p)=>n+Math.max(0,Number(p.saved)||0),0)}}
function strategyUI(){
 strategyInit();const m=strategyMetrics(),owner=isOwner(),stageNames=['Startende onderneming','Regionale speler','Professionele operator','Internationale onderneming','Grote transportgroep'];
 const recentMonths=[];for(let i=0;i<6;i++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const key=d.toISOString().slice(0,7),rows=m.ledger.filter(x=>new Date(Number(x.ts)||0).toISOString().slice(0,7)===key),net=rows.reduce((n,x)=>n+(Number(x.amount)||0),0),income=rows.filter(x=>Number(x.amount)>0).reduce((n,x)=>n+Number(x.amount),0),out= -rows.filter(x=>Number(x.amount)<0).reduce((n,x)=>n+Number(x.amount),0);recentMonths.push({key,net,income,out,count:rows.length});}
 const reserveAll=m.maintenanceReserve+m.strategicReserve+m.projectReserve,coverage=reserveAll<=Number(S.bal||0),reserveGap=Math.max(0,m.target-m.maintenanceReserve);
 return `<div class="card"><div class="hq-upgrade-intro"><div><div class="mut">ROYAL TAX · STRATEGISCHE BEDRIJFSSTURING</div><h2>Langetermijnstrategie & rendement</h2><p class="section-intro">Bouw samen aan een stabiele onderneming. Geen dagelijkse verplichtingen: alle doelen blijven staan tot jullie verder spelen.</p></div><div class="hq-visual-balance"><span class="mut">Vrij besteedbaar</span><b>${E(availableFunds())}</b></div></div><div class="grid"><div class="stat"><span>Bedrijfskas</span><b>${E(S.bal)}</b></div><div class="stat"><span>Geschatte vlootwaarde</span><b>${E(m.assets)}</b></div><div class="stat"><span>Netto mutaties · 30 dagen</span><b class="${m.net<0?'bad':'ok'}">${m.net<0?'−':''}${E(Math.abs(m.net))}</b></div><div class="stat"><span>Netto mutaties · 90 dagen</span><b class="${m.net90<0?'bad':'ok'}">${m.net90<0?'−':''}${E(Math.abs(m.net90))}</b></div></div></div>
 <div class="card"><h2>Bedrijfsontwikkeling</h2><p class="mut">Bedrijfsfase is een gezamenlijke mijlpaal en heeft op zichzelf geen automatische geldbonus. Kies de fase die past bij jullie werkelijke omvang.</p><div class="grid"><div class="stat"><span>Huidige fase</span><b>${esc(stageNames[(S.strategy.stage||1)-1])}</b><div class="mut">Niveau ${S.strategy.stage||1} van 5</div></div><div class="stat"><span>Medewerkers</span><b>${Object.keys(S.p||{}).length}</b></div><div class="stat"><span>MSFS-vluchten</span><b>${(S.log||[]).length}</b></div><div class="stat"><span>ETS2-ritten</span><b>${(ets().trips||[]).length}</b></div></div>${owner?`<div class="f" style="margin-top:12px"><div><label>Bedrijfsfase beheren</label><select id="company-stage">${stageNames.map((n,i)=>`<option value="${i+1}" ${Number(S.strategy.stage||1)===i+1?'selected':''}>Niveau ${i+1} · ${n}</option>`).join('')}</select></div><div style="align-self:end"><button class="btn" onclick="setCompanyStage(document.getElementById('company-stage').value)">Fase opslaan</button></div></div>`:''}</div>
 <div class="card"><h2>Reserves & financiële weerbaarheid</h2><p class="mut">Reserves blijven onderdeel van de bedrijfskas, maar worden apart gereserveerd en tellen niet mee als vrij besteedbaar geld. De richtlijn voor de onderhoudsreserve is ongeveer drie maanden aan geregistreerde operationele kosten op basis van de laatste 90 dagen.</p><div class="grid"><div class="stat"><span>Onderhoudsreserve</span><b>${E(m.maintenanceReserve)}</b><div class="mut">Richtlijn: ${E(m.target)}</div></div><div class="stat"><span>Strategische reserve</span><b>${E(m.strategicReserve)}</b></div><div class="stat"><span>Projectreserves</span><b>${E(m.projectReserve)}</b></div><div class="stat"><span>Reserve-status</span><b class="${coverage?'ok':'bad'}">${coverage?'Gedekt':'Onderdekking'}</b><div class="mut">${coverage?'Reserves passen binnen de kas.':'De kas is lager dan de toegewezen reserves; nieuwe investeringen zijn beperkt.'}</div></div></div>${reserveGap?`<p class="mut">Onderhoudsreserve zit ${E(reserveGap)} onder de richtlijn. Dit is advies, geen automatische boete.</p>`:''}${owner?`<form class="f" onsubmit="moveReserve(event)" style="margin-top:12px"><div><label>Reserve</label><select id="reserve-bucket"><option value="maintenance">Onderhoudsreserve</option><option value="strategic">Strategische reserve</option></select></div><div><label>Actie</label><select id="reserve-action"><option value="allocate">Geld reserveren</option><option value="release">Reserve vrijgeven</option></select></div><div><label>Bedrag (€)</label><input id="reserve-amount" type="number" min="1" step="1" required placeholder="Bijv. 10000"></div><div style="align-self:end"><button class="btn">Reserve bijwerken</button></div></form>`:''}<p class="mut">Reserves zijn interne toewijzingen en veranderen de totale kas niet. Als een echte vlucht of rit verlies maakt, kan de reserve onderdekking ontstaan; dit wordt zichtbaar gemaakt.</p></div>
 <div class="card"><div class="hq-upgrade-intro"><div><h2>Strategische investeringsdoelen</h2><p class="section-intro">Spaar gezamenlijk voor een grote uitbreiding. Een projectreserve is beschermd tegen gewone aankopen totdat de directie deze vrijgeeft.</p></div><span class="pill">${S.strategy.projects.length} doelen</span></div>${owner?`<form class="f" onsubmit="addProject(event)"><div><label>Projectnaam</label><input id="project-name" required maxlength="70" placeholder="Bijv. Nieuwe Europese basis"></div><div><label>Doelbedrag (€)</label><input id="project-target" type="number" min="1" required placeholder="500000"></div><div><label>Omschrijving</label><input id="project-desc" maxlength="180" placeholder="Waarom is deze investering nuttig?"></div><div style="align-self:end"><button class="btn">Doel toevoegen</button></div></form>`:''}${S.strategy.projects.length?S.strategy.projects.map(p=>{const saved=Math.max(0,Number(p.saved)||0),target=Math.max(1,Number(p.target)||1),pct=Math.max(0,Math.min(100,100*saved/target));return `<div class="card" style="margin-top:12px"><div class="row"><div><h3>${esc(p.name)}</h3><div class="mut">${esc(p.desc||'Geen omschrijving')} · doel ${E(target)}</div></div><b>${Math.round(pct)}%</b></div><div class="bar"><i style="width:${pct}%"></i></div><div class="row"><span>Gereserveerd ${E(saved)}</span><span>Nog nodig ${E(Math.max(0,target-saved))}</span></div>${owner?`<div class="hq-action-row" style="margin-top:10px"><button class="btn" onclick="fundProject('${p.id}')">Geld reserveren</button><button class="btn alt" onclick="releaseProject('${p.id}')">Reserve vrijgeven</button><button class="btn alt" onclick="removeProject('${p.id}')">Doel verwijderen</button></div>`:''}</div>`}).join(''):'<div class="empty">Nog geen strategische investeringsdoelen. Voeg bijvoorbeeld een nieuwe vestiging, vliegtuig of onderhoudsfaciliteit toe.</div>'}</div>
 <div class="card"><h2>Financiële rapportage</h2><p class="mut">Maandtotalen worden berekend uit het bestaande kasboek. Een kasmutatie is niet automatisch operationele winst: investeringen en reserveringen worden daarom apart beoordeeld.</p>${recentMonths.map(x=>`<div class="row"><div><b>${x.key}</b><div class="mut">${x.count} boekingen · inkomsten ${E(x.income)} · uitgaven ${E(x.out)}</div></div><b class="${x.net<0?'bad':'ok'}">${x.net<0?'−':''}${E(Math.abs(x.net))}</b></div>`).join('')}</div>
 <div class="card"><h2>Rendement per bedrijfstak</h2>${departmentProfitUI()}<p class="mut">De bestaande afdelingsrapportage blijft leidend voor het verschil tussen bruto-omzet en de geregistreerde kosten. De geschatte vlootwaarde gebruikt een indicatieve conditiecorrectie en is geen verkoopofferte.</p></div>
 <div class="card"><h2>Functies & verantwoordelijkheden</h2><p class="mut">Functies zijn organisatorisch; ze geven niet automatisch extra geld of XP. Alleen Oprichter en Mede-eigenaar hebben momenteel directiebevoegdheden in de applicatie.</p>${Object.entries(S.p||{}).map(([name,p])=>`<div class="row"><div><b>${esc(name)}</b><div class="mut">Toegetreden ${p.joined?new Date(p.joined).toLocaleDateString('nl-NL'):'onbekend'}</div></div>${owner?`<select aria-label="Functie voor ${esc(name)}" onchange="setEmployeeRole(${JSON.stringify(name)},this.value)">${['Oprichter','Mede-eigenaar','Operations Manager','Finance Manager','Senior Pilot / Senior Driver','Pilot / Driver','Trainee','Werknemer'].map(r=>`<option ${String(p.role||'Werknemer')===r?'selected':''}>${r}</option>`).join('')}</select>`:`<span class="pill">${esc(p.role||'Werknemer')}</span>`}</div>`).join('')}</div>
 <div class="card"><h2>Strategisch logboek</h2>${S.strategy.history.length?S.strategy.history.slice(0,15).map(x=>`<div class="row"><div><b>${esc(x.action)}</b><div class="mut">${esc(x.detail)} · ${esc(x.who)} · ${new Date(x.ts).toLocaleString('nl-NL')}</div></div>${x.amount?`<span>${E(x.amount)}</span>`:''}</div>`).join(''):'<div class="empty">Strategische wijzigingen verschijnen hier.</div>'}</div>`;
}

function rtUpdateHeroLive(){
 const host=document.getElementById('rt-hero-live-items'),status=document.getElementById('rt-hero-live-status');
 if(!host||!status||!S)return;
 const people=Object.entries(S.p||{}).map(([name,p])=>({name,st:presenceState(name)})).filter(p=>p.st==='online'||p.st==='away');
 const trips=Object.entries(ets().active||{}).map(([who,t])=>({who,detail:(t.from||'')+(t.to?' → '+t.to:'')}));
 const flights=Object.entries(S.activeFlights||{}).map(([who,f])=>({who,detail:(f.a||'')+(f.b?' → '+f.b:'')}));
 let bits=[];
 people.slice(0,5).forEach((p,i)=>{bits.push(`<div class="rt-hero-live-person ${p.st==='away'?'away':''}" style="left:${5+(i%3)*23}%;top:${16+Math.floor(i/3)*24}%;animation-delay:${i*.25}s"><i class="p-dot"></i><span>${esc(p.name)} · ${p.st==='away'?'Afwezig':'Online'}</span></div>`)});
 trips.slice(0,3).forEach((x,i)=>{bits.push(`<div class="rt-hero-live-vehicle truck" style="top:${65+(i%2)*12}%;animation-delay:${-i*5}s"><span class="vehicle-icon">🚛</span><span class="vehicle-label">${esc(x.who)} · ETS2</span></div>`)});
 flights.slice(0,3).forEach((x,i)=>{bits.push(`<div class="rt-hero-live-vehicle aircraft" style="top:${25+(i%2)*13}%;animation-delay:${-i*7}s"><span class="vehicle-icon">✈️</span><span class="vehicle-label">${esc(x.who)} · MSFS</span></div>`)});
 host.innerHTML=bits.join('');
 status.innerHTML=`<span class="rt-hero-status-dot"></span>${people.filter(p=>p.st==='online').length} online · ${trips.length} rijden · ${flights.length} vliegen`;
}

function internalChatUI(){S.chat=S.chat||[];const me=ls('who');return `<div class="card"><h2>Interne chat</h2><p class="section-intro">Berichten worden opgeslagen in de gedeelde bedrijfsgegevens, zodat medewerkers hetzelfde gesprek zien.</p><div class="chat-list">${S.chat.slice(-100).reverse().map(m=>`<div class="chat-message ${m.who===me?'mine':''}"><div class="chat-meta"><b>${esc(m.who||'Medewerker')}</b><span>${new Date(m.ts||Date.now()).toLocaleString('nl-NL')}</span></div><p>${esc(m.text||'')}</p></div>`).join('')||'<p class="mut">Nog geen berichten. Start het gesprek met je team.</p>'}</div><form onsubmit="sendChat(event)" style="margin-top:14px"><label>Bericht</label><textarea id="chat-text" rows="3" maxlength="1000" required placeholder="Typ een bericht voor het team…"></textarea><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px"><span class="mut">Maximaal 1000 tekens</span><button class="btn">Bericht versturen</button></div></form></div>`}

function removeActiveOperation(kind,encodedWho){if(!isOwner())return msg('Alleen de directie kan actieve ritten of vluchten verwijderen.');const who=decodeURIComponent(encodedWho||'');if(!who)return msg('Medewerker niet gevonden.');if(kind==='MSFS'){const f=S.activeFlights?.[who];if(!f)return msg('Deze actieve vlucht bestaat niet meer.');if(!confirm('Actieve vlucht van '+who+' ('+f.a+' → '+f.b+') verwijderen?\n\nDe vlucht wordt als niet voltooid bewaard. Er worden geen omzet, XP of normale vluchtstatistieken toegekend.'))return;S.activeFlights=S.activeFlights||{};delete S.activeFlights[who];S.incompleteFlights=S.incompleteFlights||[];S.incompleteFlights.unshift({who,a:f.a,b:f.b,ac:String(f.ac).startsWith('RENT:')?String(f.ac).slice(5):f.ac,type:f.type,startedAt:f.startedAt,endedAt:Date.now(),reason:'Door directie verwijderd',rental:!!f.rental});S.incompleteFlights=S.incompleteFlights.slice(0,500);feed('incomplete',who+' · actieve MSFS-vlucht verwijderd door '+ls('who')+': '+f.a+' → '+f.b);}else if(kind==='ETS2'){const t=ets().active?.[who];if(!t)return msg('Deze actieve rit bestaat niet meer.');if(!confirm('Actieve ETS2-rit van '+who+' ('+t.from+' → '+t.to+') verwijderen?\n\nDe rit wordt als niet voltooid bewaard. Er worden geen omzet, XP of normale ritstatistieken toegekend.'))return;ets().active=ets().active||{};delete ets().active[who];ets().cancelledTrips=ets().cancelledTrips||[];ets().cancelledTrips.unshift({who,from:t.from,to:t.to,cargo:t.cargo,trailer:t.trailer,truckId:t.truckId,truckName:t.truckName,startedAt:t.startedAt,endedAt:Date.now(),reason:'Door directie verwijderd',rental:!!t.rental});ets().cancelledTrips=ets().cancelledTrips.slice(0,500);feed('incomplete',who+' · actieve ETS2-rit verwijderd door '+ls('who')+': '+t.from+' → '+t.to);}else{return msg('Onbekend type operatie.');}persist();render();msg('Actieve operatie verwijderd en als niet voltooid bewaard. Er is niets financieel afgerekend.');}
function abandonFlight(){const who=ls('who'),a=S.activeFlights?.[who];if(!a)return msg('Geen actieve vlucht.');if(!confirm('Deze vlucht markeren als NIET VOLTOOID? Er worden geen omzet, XP of normale vluchtstatistieken toegekend.'))return;S.activeFlights=S.activeFlights||{};delete S.activeFlights[who];S.incompleteFlights=S.incompleteFlights||[];S.incompleteFlights.unshift({who,a:a.a,b:a.b,ac:String(a.ac).startsWith('RENT:')?String(a.ac).slice(5):a.ac,type:a.type,startedAt:a.startedAt,endedAt:Date.now(),reason:'Niet voltooid',rental:!!a.rental});S.incompleteFlights=S.incompleteFlights.slice(0,200);feed('incomplete',who+' heeft een vlucht niet voltooid: '+a.a+' → '+a.b);persist();render();msg('Vlucht als niet voltooid opgeslagen; er is niets afgerekend.');}
function crashFlight(){const who=ls('who'),a=S.activeFlights?.[who];if(!a)return msg('Geen actieve vlucht om als crash te melden.');if(!confirm('Crash van '+a.ac+' melden? De vlucht telt niet als afgerond en er wordt geen vluchtomzet of XP toegekend.'))return;const rental=!!a.rental,plane=S.fleet.find(x=>x.n===a.ac);let damageApplied=false;if(!rental&&plane){plane.cond=0;plane.status='Beschadigd';plane.damagedAt=Date.now();plane.damageReport={who,route:a.a+' → '+a.b,ts:Date.now()};damageApplied=true;}S.activeFlights=S.activeFlights||{};delete S.activeFlights[who];S.crashes=S.crashes||[];S.crashes.unshift({who,a:a.a,b:a.b,ac:a.ac,type:a.type,startedAt:a.startedAt,ts:Date.now(),rental,damageApplied,vehicleName:a.ac});S.crashes=S.crashes.slice(0,200);feed('crash',who+' heeft een crash gemeld met '+a.ac+(damageApplied?' · bedrijfstoestel beschadigd':' · huurvlucht, geen schade aan bedrijfsvloot'));persist();render();msg(damageApplied?'Crash geregistreerd. Het bedrijfstoestel is beschadigd en niet inzetbaar totdat onderhoud is uitgevoerd.': 'Crash geregistreerd als huurvlucht; er is geen schade aan de eigen vloot geboekt.');}

h=`<div class="card"><h2>Handleiding Transport HQ</h2><p><b>Transport HQ:</b> één bedrijf met MSFS 2024 en ETS2. Beide afdelingen gebruiken dezelfde bedrijfskas en dezelfde medewerkers. Onder ETS2 Overzicht start en beëindig je ritten. De ritomzet wordt automatisch berekend op basis van kilometers, vracht, oplegger, gewicht, voertuigconditie en upgrades; alleen kilometers, schade en eventuele overige kosten vul je bij afronden in. Onder Routes zie je de wegkaart met routes over echte wegen (geen rechte lijnen). Onder ETS2 Wagenpark beheer je vrachtwagens en exclusieve claims. Zonder eigen vrachtwagen wordt 48% van de totale transportomzet als huur ingehouden. ETS2 Upgrades beïnvloeden alleen transport. Alle transacties worden in Financiën bijgehouden.</p><p><b>Bedrijf:</b> onder het tabblad Bedrijf vind je de bedrijfsgegevens, actuele bedrijfsstatus, alle upgrades en de voordelen daarvan. Hier kunnen ook nieuwe upgrades worden aangeschaft of aangevraagd.</p><p><b>Live Flight Radar:</b> op Overzicht zie je alle gestarte, nog niet beëindigde vluchten met live vliegtijd. Onder Vlucht start en beëindig je je eigen vlucht; pas bij beëindigen worden inkomsten en vlieguren verwerkt.</p><p><b>Exclusieve vliegtuigclaims:</b> bij Vloot claim je maximaal één vliegtuig. Een geclaimd vliegtuig is alleen voor de toegewezen werknemer. Het beschikbaarheidsbord laat zien welke toestellen vrij, geclaimd of in vlucht zijn. De directie kan claims vrijgeven.</p><p><b>Financieel kasboek:</b> onder Financiën staan nieuwe inkomsten en uitgaven met datum, omschrijving en verantwoordelijke. Filter op soort, maand of zoekterm. Historische transacties van vóór deze uitbreiding zijn niet met terugwerkende kracht beschikbaar; bestaande maandtotalen blijven behouden. Overige uitgaven boek je ook onder Financiën.</p><p><b>Interne mededelingen:</b> de directie publiceert, verwijdert en zet berichten vast via Nieuws. Alle werknemers zien de berichten, en de belangrijkste staan ook op Overzicht.</p><p><b>Belangrijk:</b> de vluchtduur wordt gemeten met de start- en eindtijd. Bestaande oudere vluchten zonder timer kunnen geen exacte vliegtijd tonen.</p></div>`+D('1. Het idee',P(`Jullie vliegen in MSFS en registreren elke vlucht hier. Het bedrijf is gedeeld: iedereen met toegang ziet en bouwt hetzelfde bedrijf. Vluchten geven <b>XP</b>. Met XP stijgt het <b>bedrijfslevel</b>, dat nieuwe toestellen en upgrades ontgrendelt. Het geld dat jullie verdienen besteden jullie aan toestellen, upgrades en onderhoud.`),1)
+D('2. Een vlucht registreren',ul([`<b>Van en naar</b>: typ een ICAO-code of de naam van een luchthaven en kies uit de lijst. De pagina kent ${Object.keys(AP).length} luchthavens in Europa, de VS, Canada, Mexico en Cuba.`,`<b>Toestel</b>: kies een toestel uit de vloot. Het toestel bepaalt snelheid, brandstofverbruik en bereik. Een route die verder is dan het bereik wordt geweigerd.`,`<b>Soort</b>: Passagiers, Cargo, VIP, Training of Overig.`,`<b>Landing</b>: optioneel. Beïnvloedt omzet, XP en klantscore.`,`Afstand, vliegtijd, brandstof, omzet en XP berekent de pagina zelf. Je ziet de berekening voordat je op Start vlucht drukt. De registratie volgt na Beëindig vlucht.`,`<b>Overige uitgaven</b> (landingsgeld, hangar) boek je bij Financiën. Brandstof hoef je nooit in te vullen.`]))

+D('5. Route, brandstof en omzet',ul([`<b>Route-afstand</b>: de kortste afstand over de aardbol plus een realistische omweg (+12% onder 300 nm, +8% onder 1000 nm, daarboven +5%) en 12 nm voor vertrek- en aankomstprocedures. Op de kaart zie je daarom gebogen lijnen en geen rechte.`,`<b>Vliegtijd</b> = route-afstand gedeeld door de kruissnelheid van het toestel, plus 15 minuten voor opstijgen en landen.`,`<b>Brandstof</b> = verbruik per uur van het toestel x vliegtijd, tegen $${FP} per kg.`,`<b>Omzet</b> = verbruikte brandstof x $${REV} per kg x tariefsfactor. Zonder extra's blijft er ongeveer 70% over na brandstof.`,`<b>Tariefsfactor</b> = soort (Passagiers x1, Cargo x0,9, VIP x1,5, Training x0,6, Overig x0,8) x rang (+1% per werknemerlevel, max. +40%) x bedrijfslevel (+0,8% per level, max. +40%) x ervaring (+0,5% per 10 vluchten van de werknemer, max. +10%) x landing (perfect x1,1, hard x0,85) x lange afstand (boven 1000 nm x1,1).`,`<b>Klantenbonus</b> (Commerciële afdeling) +3% per niveau, <b>VIP-lounge</b> en <b>Cargo-terminal</b> +6% per niveau op hun soort vlucht, en +2% bij een klantscore vanaf 4,5.`,`Winst = omzet + bonus − brandstof. De prijsfactor (Admin) schaalt alleen nieuwe aankopen en upgrades. Nu: ×${S.f}.`]))

+D('7. Onderhoud',ul([`Elk toestel begint op 100%. Per vlucht gaat er <b>1% af per 150 nm</b> (onbekende afstand telt als 100 nm).`,`Op of onder <b>25%</b> geeft het toestel maar de helft van de XP. Het toestel kan niet kapotgaan.`,`In Vloot zet de knop <b>Onderhoud</b> het toestel terug op 100%. Prijs: toestelprijs × 0,05% × ontbrekende procenten.`,`Elk niveau <b>Onderhoudswerkplaats</b> maakt het 10% goedkoper (max. 50%).`,`Er gebeurt niets automatisch: jullie moeten zelf op de knop drukken.`]))
+D('8. Upgrades',ul(Object.values(UP).map(([n,e,b,g,r,f])=>`<b>${e} ${n}</b><br>`+r.map((q,i)=>`niveau ${i+1}: ${E(Math.round(b*g**i*S.f/100)*100)} • vanaf bedrijfslevel ${q} • ${f(i+1)}`).join('<br>'))))

+D('10. Meldingen, tevredenheid en maandprijs',ul([`Bij een <b>VIP-vlucht</b> verschijnt een melding met een (verzonnen) beroemde passagier. Alle personen zijn fictief.`,`Bij een <b>nieuw bedrijfslevel</b> of een <b>nieuwe werknemerrang</b> krijgen alle online medewerkers een melding.`,`Elke vlucht krijgt een <b>klantbeoordeling</b> (1 t/m 5): basis 3,5, perfecte landing +1,5, goede +1, harde −1, toestel onder 50% −0,5, onder 25% −1.`,`De <b>werknemer van de maand</b> is wie die maand de meeste XP haalde. In het tabblad Nieuws staat alles wat er gebeurt.`]))+D('11. Vluchtnummers, roepnamen en winstdeling',ul([`Elke vlucht krijgt een <b>vluchtnummer</b> (bijvoorbeeld RTA 101). Een eigenaar kan het prefix aanpassen in Admin.`,`Elke werknemer heeft een <b>roepnaam</b>, aan te passen in Werknemers onder Mijn profiel.`,`De <b>epauletten</b> bij je naam laten je werknemerrang zien: meer streepjes voor een hogere rang, sterren vanaf Chief pilot.`,`Eigenaren kunnen in Admin <b>winstdeling</b> uitkeren aan één medewerker of verdelen over iedereen. Het bedrag gaat uit de bedrijfskas en iedereen krijgt een melding.`,`Onder de berekening bij Vlucht staat een <b>vluchtbriefing</b> met koers, tijd, kruishoogte en brandstof inclusief reserve, die je kunt kopiëren.`,`Werknemers kunnen een toestel of upgrade alleen <b>voorstellen</b>. Een eigenaar keurt dat goed of af in Admin.`,`Bij een gelijktijdige registratie van twee werknemers gaat er niets verloren: de pagina verwerkt de vluchten na elkaar.`,`<b>Huurtoestel</b>: heb je geen vliegtuig geclaimd, dan vlieg je met een huurtoestel. Bij iedere vlucht wordt 48% van de totale omzet als huur afgetrokken. De vluchtpagina toont vooraf een melding en het kasboek toont de huur apart. Met een eigen geclaimd vliegtuig betaal je geen huur.`, `Bij <b>Financiën</b> staat het maandrapport en het rendement per toestel. Bij Vlucht staat <b>Mijn logboek</b> en bij Werknemers kun je de <b>werknemerspas</b> van een collega openen.`,`Bij Nieuws kopieer je een <b>weekstand</b> of je <b>laatste vlucht</b> als nette tekst voor Discord.`]))+D('12. Beheer en beperkingen',ul([`<b>Accounts</b>: de eerste die de pagina opent richt het bedrijf op (Oprichter) en kiest een wachtwoord. Het tweede account wordt Mede-eigenaar met alle rechten, elk account daarna start als Werknemer (rang 1). Inloggen doe je met naam en wachtwoord. Eigenaren kunnen in Admin iemand promoveren, een wachtwoord resetten of een medewerker verwijderen. Wachtwoorden worden versleuteld opgeslagen, maar dit is lichte beveiliging: gebruik geen wachtwoord dat je elders gebruikt. Vrienden hebben minimaal Contributor-rechten nodig via het deelmenu.`,`<b>Admin</b>: saldo, XP, upgrades, conditie en werknemer-XP aanpassen, vluchten verwijderen (saldo en XP gaan terug) of alles resetten. Iedereen met schrijfrechten kan dit.`,`Het logboek bewaart maximaal de laatste 2.000 vluchten. Totalen en XP blijven altijd kloppen.`,`Bij gelijktijdige wijzigingen probeert de pagina bewerkingen na elkaar te verwerken; controleer na grote wijzigingen altijd of ze zichtbaar zijn voor alle medewerkers.`,`Alleen toestellen uit de kooplijst kunnen worden gekocht. Via Admin kun je ze gratis toevoegen.`]));}

function name(ch){return /✈/.test(ch)?'plane':/🚚|🚛/.test(ch)?'truck':/⚠/.test(ch)?'alert':/◷/.test(ch)?'clock':/🔒/.test(ch)?'lock':/📢/.test(ch)?'mega':/🏢/.test(ch)?'building':/✅/.test(ch)?'check':/📌/.test(ch)?'pin':/🏆/.test(ch)?'trophy':/📜/.test(ch)?'doc':/🏅/.test(ch)?'medal':/🖱|👆/.test(ch)?'pointer':/☕/.test(ch)?'coffee':/🪑/.test(ch)?'seat':/🟡/.test(ch)?'dotY':/🟢/.test(ch)?'dotG':'dotK'}
function scan(root){var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n=[],x;while(x=w.nextNode()){if(RX.test(x.nodeValue)&&!x.parentNode.closest('option,select,textarea,script,style,title,.rt-ico'))n.push(x)}
 n.forEach(function(t){var f=document.createDocumentFragment();t.nodeValue.split(RX).forEach(function(p){if(!p)return;if(RX.test(p)&&p.length<=3)f.appendChild(ico(name(p)));else f.appendChild(document.createTextNode(p))});t.parentNode.replaceChild(f,t)})}
var raf=0,v=document.getElementById('v');
if(v)new MutationObserver(function(){try{scan(v)}catch(e){}}).observe(v,{childList:true,subtree:true});
})();

</script>

/* Scrollvoortgang bovenaan (buiten #v, dus geen flikker bij renders) */
(function(){var b=document.createElement('div');b.id='rt-prog';document.body.appendChild(b);var r=0;
function u(){r=0;var h=document.documentElement,m=h.scrollHeight-h.clientHeight;b.style.transform='scaleX('+(m>0?Math.min(1,h.scrollTop/m):0)+')'}
addEventListener('scroll',function(){if(!r)r=requestAnimationFrame(u)},{passive:true});addEventListener('resize',u);u()})();
</script>
